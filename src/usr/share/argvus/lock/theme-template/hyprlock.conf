# ===================================
#  Hyprlock 0.9+
#  File: ~/.config/hypr/hyprlock.conf
#  Theme: {{ theme.id }}
# ===================================

background {
  monitor =
  path = ~/.cache/argvus/hypr/hyprlock-wallpaper-blur.png
  blur_size = 3
  blur_passes = 3
  brightness = 0.55
}

input-field {
  monitor =
  size = 280, 45
  outline_thickness = 1
  outer_color = {{ @accent | rgb_hex }}
  inner_color = {{ @lock_inner_color | rgb_hex }}
  font_color = {{ @fg | rgb_hex }}
  placeholder_text = <i><span font_family='Symbols Nerd Font Mono'></span>  __ARGVUS_LOCK_PASSWORD__</i>
  position = 0, -100
  halign = center
  valign = center
  rounding = {{ layout.lock_rounding_1 }}
}

shape {
  monitor =
  size = 320, 150
  color = {{ @lock_color | rgba }}
  rounding = {{ layout.lock_rounding_2 }}
  position = 0, 83
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = {{ @lock_color_2 | rgba }}
  font_size = 64
  font_family = IBM Plex Mono
  position = 0, 100
  halign = center
  valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a, %d %B"
    color = {{ @lock_color_3 | rgba }}
    font_size = 18
    font_family = IBM Plex Mono
    position = 0, 40
    halign = center
    valign = center
}
